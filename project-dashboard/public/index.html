<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%232a78d6'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%232a78d6' opacity='.55'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%232a78d6' opacity='.55'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%232a78d6' opacity='.3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">
      <h1 id="title">Projects</h1>
      <span class="root" id="root" title=""></span>
    </div>
    <div class="seg" role="group" aria-label="View" id="view-switch">
      <button type="button" data-view="pm" aria-pressed="false">Project management</button>
      <button type="button" data-view="tech" aria-pressed="false">Technical</button>
    </div>
    <span class="spacer"></span>
    <span class="status-line" id="scan-status"></span>
    <button type="button" class="btn" id="refresh" title="Rescan the projects folder now">Refresh</button>
    <button type="button" class="btn ghost" id="theme" title="Theme: auto / light / dark" aria-label="Toggle theme">◐</button>
    <button type="button" class="btn ghost" id="settings-btn" aria-label="Settings" title="Settings">⚙</button>
  </header>
  <div class="filters" id="filters"></div>
  <main id="main"><div class="empty">Loading…</div></main>
  <div id="overlay"></div>
  <div id="popover"></div>
  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
